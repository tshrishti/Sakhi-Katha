<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My work - Sakhi Khata</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main><div id="toast"></div>
<script src="common.js"></script><script>
async function load(){const [ts,es]=await Promise.all([api('/seller/tasks'),api('/seller/earnings')]);
 $('#m').innerHTML=`<div class="card"><h2>My tasks</h2>${ts.length?`<table><tr><th>Order</th><th>Work</th><th>Pieces</th><th>Pay</th><th>Done</th><th>Why me</th><th></th></tr>${ts.map(t=>`<tr><td>#${t.order_id} ${chip(t.status)}</td><td>${esc(t.stage)}</td><td>${t.units}</td><td>Rs ${esc(t.expected_pay)}</td><td>${t.done}/${t.units}</td><td class="muted">${esc(t.why)}${(t.checklist||[]).length?`<details><summary>What the buyer wants checked</summary><ul>${t.checklist.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></details>`:''}</td>
 <td>${['accepted','planned'].includes(t.status)?`${t.accepted?'<span class="muted">You accepted.</span>':`<button onclick="act('/seller/orders/${t.order_id}/accept','POST',{},load)">Accept task</button>`} <button class="red" onclick="act('/seller/orders/${t.order_id}/decline','POST',{},load)">I cannot do this</button>`:t.status==='in_production'?`<button onclick="done(${t.order_id})">Add pieces done</button> <button onclick="sample(${t.order_id})">Send first sample (photo)</button>`:''}</td></tr>`).join('')}</table><p class="muted">Declining is never penalised.</p>`:'<p class="muted">No tasks right now.</p>'}</div>
 <div class="card"><h2>My earnings - how it was calculated</h2>${es.length?es.map(e=>`<div class="row"><b>Order #${e.order_id}</b> ${chip(e.status)}</div><p>${esc(e.explain)}</p>
 ${e.status==='payout_pending'?`<div class="row">${e.approved_by_me?'<span class="muted">You approved.</span>':`<button onclick="act('/seller/orders/${e.order_id}/payout/approve','POST',{},load)">This is correct</button>`}
 <button class="red" onclick="dispute(${e.order_id})">I disagree</button></div>`:''}`).join('<hr>'):'<p class="muted">No earnings recorded yet.</p>'}</div>`}
function sample(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return;
 const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);toast('Sending and checking the photo...');act('/seller/orders/'+id+'/sample','POST',{note:prompt('Short note (optional)')||'',photo:c.toDataURL('image/jpeg',.7)},load)};
 img.onerror=()=>toast('That file is not a photo',1);img.src=URL.createObjectURL(file)};f.click()}
function done(id){const n=prompt('How many pieces did you finish?');if(n)act('/seller/orders/'+id+'/done','POST',{n:+n},load)}
function dispute(id){const r=prompt('What is wrong? (the payment waits until the leader resolves it)');if(r)act('/seller/orders/'+id+'/dispute','POST',{reason:r},load)}

const _rcTxt=c=>`${esc(c.label)} v${c.version||0} ${c.source==='default'?'(template default)':'(group approved)'}: `+c.stages.map(s=>`${esc(s.name)} Rs ${s.rate} x${s.workers}`).join(', ')+` | material Rs ${c.cost.material}, ${c.cost.minutes} min, Rs ${c.cost.hourly}/hr, overhead ${c.cost.overhead_pct}%, margin ${c.cost.margin_pct}%`;

const _load=load;load=async function(){await _load();const d=await api('/seller/ratecards');const pend=d.history.filter(h=>h.status==='proposed');
 $('#m').insertAdjacentHTML('beforeend',`<div class="card"><h2>Rate cards your group uses</h2>${d.active.map(c=>`<p>${_rcTxt(c)}</p>`).join('')}
 ${pend.map(h=>`<p class="warn">Proposed: ${_rcTxt({...h,source:'group'})} ${esc(h.note||'')} ${h.i_approved?'<span class="muted">You approved.</span>':`<button onclick="act('/seller/ratecards/${h.id}/approve','POST',{},load)">I agree with these rates</button>`}</p>`).join('')||'<p class="muted">Nothing waiting for your approval.</p>'}</div>`)};
boot('seller','My work and pay').then(load);
</script></body></html>
