<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer - Sakhi Khata</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main><div id="toast"></div>
<script src="common.js"></script><script>
async function load(){const [gs,os]=await Promise.all([api('/buyer/groups'),api('/buyer/orders')]);
 $('#m').innerHTML=`<div class="card"><h2>Place an order</h2><div class="row"><select id="g">${gs.map(g=>`<option value="${g.id}">${esc(g.name)} - ${esc(g.village)} (${g.orders_delivered} orders delivered)</option>`).join('')}</select></div>
 <textarea id="t" placeholder="e.g. 200 blue cloth bags, Rs 60 each, in 5 days"></textarea><div class="row"><button onclick="send()">Send order</button></div>
 <p class="muted">You will see the group's quote and order status here. Worker details and costs stay private.</p></div>
 <div class="card"><h2>My orders</h2>${os.length?`<table><tr><th>#</th><th>Order</th><th>Group</th><th>Status</th><th>Quote</th><th></th></tr>${os.map(o=>`<tr><td>${o.id}</td><td>${o.order.qty} pcs @ Rs ${o.order.offered_price}, ${o.order.deadline_days} days</td><td>${esc(o.group)}</td><td>${chip(o.status)}</td><td>${o.quote?'Rs '+esc(o.quote):'-'}</td>
 <td>${o.status==='quoted'?`<button onclick="act('/buyer/orders/${o.id}/accept','POST',{},load)">Accept quote</button>`:''}${o.status==='dispatched'?`<button onclick="signoff(${o.id},${o.delivery.shipments.slice(-1)[0].qty})">Confirm delivery</button>`:''}${['submitted','quoted','accepted','planned'].includes(o.status)?` <button class="red" onclick="cancelO(${o.id})">Cancel</button>`:''}${dlv(o)}</td></tr>`).join('')}</table>`:'<p class="muted">No orders yet.</p>'}</div>`}
const dlv=o=>{const d=o.delivery;if(!d||!d.shipments.length)return o.status==='blocked'?`<div class="warn">On hold${d&&d.blocked?': '+esc(d.blocked.reason):''}</div>`:'';
 return `<div class="muted">Delivered ${d.delivered}/${d.ordered}${d.shipments.map(x=>`<br>Shipment ${x.i+1}: ${x.qty} pcs via ${esc(x.courier)}${x.tracking?' ('+esc(x.tracking)+')':''}${x.has_photo?` <a href="/api/buyer/orders/${o.id}/delivery/${x.i}/photo" target="_blank">photo</a>`:''}${x.received!=null?', you received '+x.received:''}`).join('')}${o.status==='blocked'&&d.blocked?`<br><b class="warn">On hold: ${esc(d.blocked.reason)}</b>`:''}</div>`};
function signoff(id,sent){const n=prompt('How many pieces arrived? (sent: '+sent+')',sent);if(n===null)return;const short=+n<sent;
 const fin=short&&confirm('Fewer than sent. OK = accept this shortfall and close the order. Cancel = the group sends the rest.');
 act('/buyer/orders/'+id+'/signoff','POST',{received:+n,final:!!fin,note:prompt('Note (optional)')||''},load)}
function cancelO(id){if(confirm('Cancel this order? Only possible before work starts.'))act('/buyer/orders/'+id+'/cancel','POST',{reason:prompt('Reason (optional)')||''},load)}
async function send(){try{const v=await api('/buyer/orders','POST',{group_id:+$('#g').value,text:$('#t').value});toast('Order sent'+(v.unclear.length?'. Please clarify: '+v.unclear.join('; '):''));load()}catch(e){toast(e.message,1)}}
boot('buyer','Buyer dashboard').then(load);
</script></body></html>
