<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leader - Sakhi Khata</title><link rel="stylesheet" href="style.css?v=phase3b"></head><body><main id="m"></main><div id="toast" role="status"></div>
<script src="common.js?v=phase3"></script><script src="js/tabs.js?v=phase3"></script><script src="js/live.js?v=phase3"></script><script>
const RES={possible_defect:'Possible defect',met:'Looks OK',cannot_tell:'Cannot tell from photo'};
const fitResults=Object.create(null);
const ai=(q,oid,i)=>{const s=q.screening;if(!s)return '';
 const head='<div class="ai"><b>AI pre-check</b> <span class="muted">(suggestion only. You decide.)</span>';
 if(s.status!=='ok')return head+`<p class="${s.status==='unavailable'?'warn':''}">${esc(s.summary)} ${q.status==='pending'&&s.status==='unavailable'?`<button onclick="act('/leader/orders/${oid}/quality/${i}/rescreen','POST',{},load)">Try again</button>`:''}</p></div>`;
 const f=s.items.filter(x=>x.result==='possible_defect'),u=s.items.filter(x=>x.result==='cannot_tell');
 return head+(s.summary?`<p class="muted">${esc(s.summary)}</p>`:'')+(f.length?`<p class="bad">${f.length} possible problem(s) to verify on the piece:</p><ul>${f.sort((a,b)=>'high medium low'.indexOf(a.confidence)-'high medium low'.indexOf(b.confidence)).map(x=>`<li><span class="conf ${esc(x.confidence)}">${esc(x.confidence)} confidence</span> <b>${esc(x.criterion)}</b><br><span class="muted">${esc(x.note)}</span></li>`).join('')}</ul>`:'<p>No problems spotted in the photo. The AI can miss things.</p>')
  +(u.length?`<p class="muted">${u.length} point(s) could not be judged from the photo: ${u.map(x=>esc(x.criterion)).join('; ')}</p>`:'')
  +`<details><summary class="muted">All ${s.items.length} checks</summary><table>${s.items.map(x=>`<tr><td>${esc(x.criterion)}</td><td>${RES[x.result]}</td><td>${esc(x.confidence)}</td></tr>`).join('')}</table></details></div>`};
const checklist=o=>`<details class="cl"><summary>Buyer's quality checklist (${(o.checklist||[]).length})</summary><p class="muted">The AI checks sample photos against this list. One point per line. Add anything the buyer told you, remove what does not apply.</p>
 <textarea id="cl${o.id}">${(o.checklist||[]).map(c=>esc(c.text)).join('\n')}</textarea><button onclick="saveCl(${o.id})">Save checklist</button></details>`;
function fitCheckMarkup(o){
 if(!['submitted','quoted'].includes(o.status))return '';
 const result=fitResults[o.id];
 if(!result)return `<section class="card"><h3>Order feasibility</h3><p>Check deadline and available skills before quoting. Material stock is not tracked.</p><button class="secondary" onclick="checkFit(${o.id})">Check order fit</button></section>`;
 const summary=result.feasible?'Looks workable':'Needs a change or group review';
 return `<section class="card"><h3>Order feasibility</h3><p>${chip(result.feasible?'settled':'blocked')} ${esc(summary)}</p>
 <p><b>Materials:</b> Stock is not tracked yet.</p><p><b>Deadline, capacity and skills:</b> ${result.feasible?'The current plan appears workable.':'Review the issues below with the group.'}</p>
 ${(result.issues||[]).length?`<ul>${result.issues.map(issue=>`<li>${esc(issue)}</li>`).join('')}</ul>`:''}
 ${(result.options||[]).length?`<p><b>Options to discuss</b></p><ul>${result.options.map(option=>`<li>${esc(option.label)}</li>`).join('')}</ul>`:''}
 <p class="muted">This is advice only. The group decides before sending a quote.</p><button class="secondary" onclick="checkFit(${o.id})">Check again</button></section>`;
}
const card=o=>{const p=o.price,pl=o.plan,po=o.payout;let a='';
 if(o.status==='submitted'||o.status==='quoted')a=`<div class="row"><input id="c${o.id}" placeholder="Counter Rs/pc (blank = floor-based)" size="26"><button onclick="act('/leader/orders/${o.id}/quote','POST',{counter:$('#c${o.id}').value},load)">${o.status==='quoted'?'Re-quote':'Send quote'}</button></div>`;
 if(o.status==='accepted')a=`<button onclick="act('/leader/orders/${o.id}/plan','POST',{},load)">Build fair plan</button>`;
 if(o.status==='planned')a=`<button onclick="act('/leader/orders/${o.id}/start','POST',{},load)">Approve and start</button> <button onclick="act('/leader/orders/${o.id}/plan','POST',{},load)">Replan</button>`;
 if(o.status==='in_production')a=`${(o.quality||[]).map((q,i)=>`<div class="qrow"><p>${esc(q.name)} sample (${esc(q.stage)}) ${chip(q.status)} ${q.has_photo?`<a href="/api/leader/orders/${o.id}/quality/${i}/photo" target="_blank">photo</a>`:''} ${q.status==='pending'?`<button onclick="act('/leader/orders/${o.id}/quality','POST',{member:${Number(q.member)},decision:'pass'},load)">Pass</button> <button class="red" onclick="rework(${o.id},${Number(q.member)})">Needs rework</button>`:''}</p>${ai(q,o.id,i)}</div>`).join('')}
 <p>Finished through every stage: ${o.progress.finished}/${o.progress.needed} <button onclick="risk(${o.id})">Check deadline</button> ${o.risk?`<span class="${o.risk.shortfall?'bad':''}">${o.risk.shortfall?'Short by '+o.risk.shortfall+' pieces. You and the group decide: '+o.risk.options.map(esc).join('; '):'On time'}</span>`:''}</p><table>${pl.assignments.map(x=>`<tr><td>${esc(x.name)} - ${esc(x.stage)}</td><td>accepted <input class="acc" data-o="${o.id}" data-k="${x.member}:${x.stage}" type="number" min="0" value="${x.units}" style="width:80px"></td><td>need rework <input class="pen" data-k="${x.member}:${x.stage}" data-o="${o.id}" type="number" min="0" value="0" style="width:70px"></td></tr>`).join('')}</table><button onclick="payout(${o.id})">Propose payout</button>`;
 if(o.status==='payout_pending')a=`<p>Total Rs ${esc(po.total)}. Leader ${o.approvals.leader?'approved':'pending'}, members approved: ${o.approvals.members.length}.</p>${o.approvals.leader?'':`<button onclick="act('/leader/orders/${o.id}/payout/approve','POST',{},load)">Approve payout</button>`}
 ${o.disputes.map((d,i)=>d.open?`<p class="bad">Dispute by ${esc(d.name)}: ${esc(d.reason)} <button onclick="act('/leader/orders/${o.id}/disputes/${i}/resolve','POST',{note:prompt('Resolution note')||''},load)">Resolve</button></p>`:'').join('')}`;
 const d=o.delivery,sh=d.shipments,last=sh[sh.length-1];
 if(['settled','partially_delivered'].includes(o.status))a=`<p>Delivered ${d.delivered}/${d.ordered}. Count the packed pieces (still owed: ${d.remaining}).</p><div class="row"><input id="rd${o.id}" type="number" min="1" max="${d.remaining}" value="${d.remaining}" style="width:90px"><input id="rn${o.id}" placeholder="Note"><button onclick="act('/leader/orders/${o.id}/ready','POST',{counted:+$('#rd${o.id}').value,note:$('#rn${o.id}').value},load)">Mark ready for delivery</button></div>`;
 if(o.status==='ready_for_delivery')a=`<p>${d.qc.counted} of ${d.qc.owed} owed pieces counted${d.qc.match?'':' <b class="warn">(partial delivery)</b>'}.</p><div class="row"><input id="dc${o.id}" placeholder="Courier / bus / vehicle"><input id="dt${o.id}" placeholder="Tracking / vehicle no."><input id="dd${o.id}" placeholder="Dispatch date"><button onclick="act('/leader/orders/${o.id}/dispatch','POST',{courier:$('#dc${o.id}').value,tracking:$('#dt${o.id}').value,date:$('#dd${o.id}').value},load)">Dispatch</button></div>`;
 if(o.status==='dispatched')a=`<p>Shipment ${last.i+1}: ${last.qty} pcs via ${esc(last.courier)}${last.tracking?' ('+esc(last.tracking)+')':''}. Waiting for the buyer to confirm. ${last.has_photo?`<a href="/api/leader/orders/${o.id}/delivery/${last.i}/photo" target="_blank">delivery photo</a>`:`<button onclick="dphoto(${o.id})">Add delivery photo</button>`}</p>`;
 if(o.status==='blocked')a=`<p class="warn">Blocked: ${esc((d.blocked||{}).reason)} <button onclick="act('/leader/orders/${o.id}/unblock','POST',{},load)">Unblock</button></p>`;
 if(o.status==='closed')a=`<p>Delivered ${d.delivered}/${d.ordered}. Closed.</p>`;
 if(o.status==='cancelled')a=`<p class="muted">Cancelled${d.cancelled?' by '+esc(d.cancelled.by)+(d.cancelled.reason?': '+esc(d.cancelled.reason):''):''}.</p>`;
 if(['settled','ready_for_delivery','dispatched','partially_delivered'].includes(o.status))a+=` <button class="red" onclick="blockO(${o.id})">Block</button>`;
 if(['submitted','quoted','accepted','planned'].includes(o.status))a+=` <button class="red" onclick="cancelO(${o.id})">Cancel order</button>`;
 return `<div class="card"><div class="row"><b>#${o.id}</b> ${chip(o.status)} <span>${o.order.qty} pcs @ Rs ${o.order.offered_price}, ${o.order.deadline_days} days, ${esc(o.order.colour||'')}</span></div>
 ${o.unclear.length?`<p class="warn">Check with buyer: ${o.unclear.map(esc).join('; ')}</p>`:''}
 ${(o.decline_details||[]).length?`<section class="card"><h3>Tasks declined</h3>${o.decline_details.map(item=>`<p>${esc(item.name)} · ${esc(item.stage)} · ${esc(item.reason||'No reason recorded')}</p>`).join('')}</section>`:''}
 ${fitCheckMarkup(o)}
 ${p?`<p class="${p.loss_making?'bad':''}">Floor Rs ${esc(p.per_unit.floor)}/pc. At the offer, women earn Rs ${esc(p.effective_hourly_at_offer)}/hr vs target Rs ${esc(p.target_hourly)}/hr (${esc(p.pay_gap_pct)}% less). Quote: Rs ${esc(o.quote)}</p>`:''}
 ${pl&&o.status==='planned'?`<table>${pl.assignments.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.stage)} x${x.units}</td><td>Rs ${esc(x.expected_pay)}</td><td>${(o.task_accepted||[]).includes(x.member)?'<span class="ok">accepted</span>':'<span class="muted">not yet accepted</span>'}</td><td class="muted">${esc(x.why)}</td></tr>`).join('')}</table>${pl.issues.length?`<p class="warn">Risk: ${pl.issues.map(esc).join('; ')}</p>`:''}${(pl.options||[]).length?`<div class="warn"><b>Not feasible as ordered. Options:</b><ul>${pl.options.map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul><span class="muted">Agree one with the buyer, then re-quote or replan.</span></div>`:''}`:''}${a}${['accepted','planned','in_production'].includes(o.status)?checklist(o):''}</div>`};
let overviewData=null, teamData=[], rateCardsData=null, buyersData=null, alertsData=null, leavesData=null, noticesData=null, extraLoading={}, liveClient=null, tabsReady=false, orderView='list';
const healthRule='Late: due date passed. Blocked: delivery is blocked. At risk: deadline check projects a shortfall. Waiting: leader action is needed. Stale: no report for 24 hours. On track: none of these.';
function ensureShell(){
 if($('#leader-dashboard'))return;
 $('#m').innerHTML=`<section id="leader-dashboard">
  <div class="dashboard-heading"><div><p class="muted">Group overview</p><h1 id="group-title">Your group</h1></div><span id="live-status" class="live-status">Connecting</span></div>
  <div id="offline-banner" class="offline-banner" hidden>Connection lost. Showing the latest available information.</div>
  <nav class="dashboard-tabs" role="tablist" aria-label="Leader dashboard">
   <button id="tab-overview" role="tab" data-tab="overview" aria-controls="tab-panel">Overview <span id="overview-badge" class="tab-badge" hidden></span></button>
   <button id="tab-orders" role="tab" data-tab="orders" aria-controls="tab-panel">Orders <span id="orders-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="team" aria-controls="tab-panel">Team <span id="team-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="quality" aria-controls="tab-panel">Quality <span id="quality-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="delivery" aria-controls="tab-panel">Delivery <span id="delivery-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="payouts" aria-controls="tab-panel">Payouts <span id="payouts-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="buyers" aria-controls="tab-panel">Buyers <span id="buyers-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="pricing" aria-controls="tab-panel">Pricing <span id="pricing-badge" class="tab-badge" hidden></span></button>
   <button role="tab" data-tab="alerts" aria-controls="tab-panel">Alerts <span id="alerts-badge" class="tab-badge" hidden></span></button>
  </nav><section id="tab-panel" role="tabpanel" tabindex="0"></section></section>`;
 if(!tabsReady){SakhiTabs.install($('#leader-dashboard'),view=>{
  if(view.tab==='pricing'&&!rateCardsData)api('/leader/ratecards').then(d=>{rateCardsData=d;renderTab(SakhiTabs.current());}).catch(e=>toast(e.message,1));
  renderTab(view);
 },'overview');tabsReady=true;}
}
const money=v=>`₹${Number(v||0).toLocaleString('en-IN')}`;
const dateIST=ts=>ts?new Date(ts*1000).toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short'}):'Not set';
const since=ts=>{if(!ts)return 'No report yet';const m=Math.max(0,Math.floor((Date.now()/1000-ts)/60));return m<1?'just now':`${m} min ago`};
function keyed(container,items,key,html){
 const current=new Map([...container.children].map(node=>[node.dataset.key,node]));
 items.forEach(item=>{const id=String(typeof key==='function'?key(item):item[key]);let node=current.get(id);if(!node){node=document.createElement('article');node.dataset.key=id;}node.innerHTML=html(item);container.appendChild(node);current.delete(id);});
 current.forEach(node=>node.remove());
}
function orderTile(o){
 return `<div class="order-tile" data-order-id="${o.id}"><div><b>Order #${o.id}</b> ${chip(o.status)} <p>${esc(o.order.product||'Order')} × ${o.order.qty} · ${esc(o.buyer_name||'Buyer')}</p>
 <p class="muted">Due ${dateIST(o.due_at)}${o.days_left==null?'':` · ${o.days_left} day(s) left`} · Last reported ${since(o.last_reported_at)}</p>
 ${(o.stages||[]).map(s=>`<div class="stage-line"><span>${esc(s.name)}</span><div class="stage-bar" aria-label="${esc(s.name)} ${s.pct}%"><span style="width:${s.pct}%"></span></div><span>${s.pct}%</span></div>`).join('')}
 </div><div><span class="chip health-${o.health.toLowerCase().replace(/\s/g,'-')}" title="${healthRule}">${esc(o.health)}</span><button class="secondary" onclick="openOrder(${o.id})">Open order</button></div></div>`;
}
function renderOverview(d){
 $('#group-title').textContent=d.group||'Your group';
 $('#overview-badge').textContent=d.decision_count||0;$('#overview-badge').hidden=!d.decision_count;
 const k=d.kpis;
 if(!$('#leader-kpis'))$('#tab-panel').innerHTML=`<div id="leader-kpis" class="kpi-grid">
  <div class="kpi"><strong id="kpi-active"></strong><span>Active orders</span></div>
  <div class="kpi"><strong id="kpi-pieces"></strong><span>Pieces finished today</span></div>
  <div class="kpi"><strong id="kpi-track"></strong><span>Orders on track</span></div>
  <div class="kpi"><strong id="kpi-waiting"></strong><span>Waiting for your decision</span></div>
  <div class="kpi"><strong id="kpi-payout"></strong><span>Payouts awaiting approval</span></div>
  <div class="kpi"><strong id="kpi-buyer-due"></strong><span>Buyer money due (recorded)</span></div>
 </div><section class="card"><h2>Needs your decision <span id="queue-count" class="tab-badge"></span></h2>
  <div id="decision-list" class="decision-list"></div><button id="see-all" class="secondary" onclick="location.hash='#orders'">See all orders</button>
 </section><section class="card"><h2>Live orders</h2><div id="overview-orders" class="order-list"></div></section>
 <section class="card"><h2>Latest activity</h2><div id="activity-list"></div></section>`;
 $('#kpi-active').textContent=k.active_orders;$('#kpi-pieces').textContent=k.pieces_finished_today;
 $('#kpi-track').textContent=k.orders_on_track;$('#kpi-waiting').textContent=k.waiting_for_leader;
 $('#kpi-payout').textContent=k.payout_waiting;
 $('#kpi-buyer-due').textContent=money(k.buyer_money_due);
 $('#queue-count').textContent=d.decision_count;$('#see-all').hidden=d.decision_count<=5;
 const list=$('#decision-list');
 list.innerHTML=d.decision_queue.length?d.decision_queue.map(x=>`<div class="decision-row"><span>${esc(x.label)}${x.order_id?` · #${x.order_id}`:''}</span>${x.order_id?`<button class="secondary" onclick="openOrder(${x.order_id})">Review</button>`:`<button class="secondary" onclick="location.hash='#orders'">Review</button>`}</div>`).join(''):'<p class="muted">Nothing waiting for you.</p>';
 keyed($('#overview-orders'),d.orders,'id',orderTile);
 $('#activity-list').innerHTML=d.activity.length?d.activity.map(x=>`<p class="row"><span>${esc(x.summary)}${x.order_id?` · Order #${x.order_id}`:''}</span><span class="muted">${since(x.ts)}</span></p>`).join(''):'<p class="muted">No recent updates.</p>';
}
function renderOrders(d){
 $('#orders-badge').textContent=d.decision_count||0;$('#orders-badge').hidden=!d.decision_count;
 const priorSearch=$('#order-search')?.value||'',priorStatus=$('#status-filter')?.value||'';
 const priorHealth=$('#health-filter')?.value||'',priorDue=$('#due-filter')?.value||'';
 const orders=[...d.orders].sort((a,b)=>(a.days_left??9999)-(b.days_left??9999));
 if(!$('#orders-list'))$('#tab-panel').innerHTML=`<section class="card"><div class="dashboard-heading"><div><h2>Orders</h2><p class="muted">Sorted by due date. Progress is reported by members.</p></div></div>
  <div class="row"><label for="order-search">Search order, buyer or product</label><input id="order-search" placeholder="Search" oninput="filterOrders()">
  <label for="status-filter">Status</label><select id="status-filter" onchange="filterOrders()"><option value="">All statuses</option>${[...new Set(orders.map(o=>o.status))].map(s=>`<option value="${esc(s)}">${esc(s.split('_').join(' '))}</option>`).join('')}</select>
  <label for="health-filter">Health</label><select id="health-filter" onchange="filterOrders()"><option value="">All health</option>${[...new Set(orders.map(o=>o.health))].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
  <label for="due-filter">Due by</label><input id="due-filter" type="date" onchange="filterOrders()">
  <button class="secondary" id="list-view" aria-pressed="true" onclick="setOrderView('list')">List</button><button class="secondary" id="board-view" aria-pressed="false" onclick="setOrderView('board')">Board</button></div>
  <div id="orders-list" class="order-list"></div></section>
  `;
 keyed($('#orders-list'),orders,'id',orderTile);
 if(priorSearch&&!$('#order-search').value)$('#order-search').value=priorSearch;
  $('#status-filter').innerHTML='<option value="">All statuses</option>'+[...new Set(orders.map(o=>o.status))].map(s=>`<option value="${esc(s)}">${esc(s.split('_').join(' '))}</option>`).join('');
  $('#health-filter').innerHTML='<option value="">All health</option>'+[...new Set(orders.map(o=>o.health))].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
  $('#status-filter').value=priorStatus;
  $('#health-filter').value=priorHealth;
  if(priorHealth&&!$('#health-filter').value)$('#health-filter').value=priorHealth;
 if(priorDue&&!$('#due-filter').value)$('#due-filter').value=priorDue;
 setOrderView(orderView);
 filterOrders();
 const drawerId=SakhiTabs.current().tab==='orders'?SakhiTabs.current().item:null;
 if(drawerId)showDrawer(drawerId);else closeDrawer(false);
}
function renderRateCards(d){
 if(!d)return '';
 const pend=d.history.filter(h=>h.status==='proposed');
 return `<section class="card"><h2>Rate cards (approved by the group)</h2>${d.active.map(c=>`<p>${_rcTxt(c)}</p>`).join('')}
 ${pend.map(h=>`<p class="warn">Waiting: ${_rcTxt({...h,source:'group'})} - members approved ${h.approvals.members.length}/${h.needed_members} <button class="red" onclick="act('/leader/ratecards/${h.id}/reject','POST',{},load)">Withdraw</button></p>`).join('')}
 <h3>Propose a new version</h3><div class="row"><select id="rcp">${d.active.map(c=>`<option value="${esc(c.product)}">${esc(c.label)}</option>`).join('')}</select>
 <input id="rcs" size="46" placeholder="Stages: name:rate:workers"><input id="rcc" size="40" placeholder="Material, minutes, hourly, overhead %, margin %"><input id="rcn" placeholder="Note"><button onclick="rcPropose()">Propose</button></div>
 <p class="muted">Members approve it in their dashboard. Orders already quoted keep the card they were priced on.</p></section>`;
}
function renderTab(view){
 if(!overviewData)return;
 const tabs=[...$('#leader-dashboard').querySelectorAll('[role="tab"]')];
 const tab=tabs.some(x=>x.dataset.tab===view.tab)?view.tab:'overview';
 tabs.forEach(button=>{const active=button.dataset.tab===tab;button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1;});
 $('#tab-panel').classList.toggle('overview-panel',tab==='overview');
 const orders=overviewData.orders;
 const qualityWaiting=orders.reduce((sum,o)=>sum+(o.quality||[]).filter(q=>q.status==='pending').length,0);
 setLeaderBadge('team-badge',teamData.filter(member=>member.status==='Behind').length);
 setLeaderBadge('quality-badge',qualityWaiting);
 setLeaderBadge('delivery-badge',orders.filter(o=>['settled','ready_for_delivery','dispatched','partially_delivered','blocked'].includes(o.status)).length);
 setLeaderBadge('payouts-badge',orders.filter(o=>o.status==='payout_pending').length);
 setLeaderBadge('buyers-badge',buyersData?buyersData.filter(buyer=>buyer.balance_due>0).length:0);
 setLeaderBadge('pricing-badge',rateCardsData?.history.filter(card=>card.status==='proposed').length||0);
 setLeaderBadge('alerts-badge',alertsData?.length||0);
 if(tab==='overview')renderOverview(overviewData);
 else if(tab==='orders')renderOrders(overviewData);
 else if(tab==='team'){renderTeam();if(leavesData===null||noticesData===null)loadLeaderExtra('team');}
 else if(tab==='quality')renderQuality();
 else if(tab==='delivery')renderDelivery();
 else if(tab==='payouts')renderPayouts();
 else if(tab==='buyers'){
  if(buyersData)renderBuyers();
  else loadLeaderExtra('buyers');
 }
 else if(tab==='pricing')renderPricing();
 else if(tab==='alerts'){
  if(alertsData)renderAlerts();
  else loadLeaderExtra('alerts');
 }
}
function setLeaderBadge(id,count){const badge=$('#'+id);badge.textContent=count||'';badge.hidden=!count;}
function loadLeaderExtra(key){
 if(extraLoading[key])return;
 extraLoading[key]=true;
 const requests=key==='team'?Promise.all([api('/leader/notices'),api('/leader/leaves')])
  :api(key==='buyers'?'/leader/buyers':'/leader/alerts');
 Promise.resolve(requests).then(data=>{
  if(key==='team'){noticesData=data[0];leavesData=data[1];}
  else if(key==='buyers')buyersData=data;
  else alertsData=data;
  if(SakhiTabs.current().tab===(key==='team'?'team':key))renderTab(SakhiTabs.current());
 }).catch(error=>toast(error.message,1)).finally(()=>{extraLoading[key]=false;});
}
function renderTeam(){
 const rows=teamData||[];
 $('#tab-panel').innerHTML=`<section class="card"><div class="dashboard-heading"><div><h2>Team workload</h2><p class="muted">Work status is based on member reports and declared capacity. It is not location tracking.</p></div></div>

}

 if(note===null)return;
 try{await api(`/leader/leaves/${Number(id)}/resolve`,'POST',{status,note});toast('Leave request updated');leavesData=await api('/leader/leaves');renderTeam();}
 catch(error){toast(error.message,1);}
}
async function leaderPriceCheck(){
 try{

  const p=result.price;
  $('#price-result').innerHTML=`<p>Rate card ${esc(result.product)} v${result.version}</p><p>Price floor: ${money(p.per_unit.floor)} per piece · Suggested counter: ${money(p.suggested_counter)}</p><p>Effective hourly pay at offer: ${money(p.effective_hourly_at_offer)}/hr · Target: ${money(p.target_hourly)}/hr</p><p>${p.loss_making?'Offer is below the cost floor.':'Offer meets the cost floor.'}</p>`;
 }catch(error){toast(error.message,1);}
}
function filterOrders(){
 const term=($('#order-search')?.value||'').trim().toLowerCase(),status=$('#status-filter')?.value||'';
 const health=$('#health-filter')?.value||'',due=$('#due-filter')?.value||'';
 const dueBy=due?new Date(`${due}T23:59:59+05:30`).getTime()/1000:null;
 document.querySelectorAll('#orders-list [data-key]').forEach(node=>{
  const o=overviewData.orders.find(x=>String(x.id)===node.dataset.key);
  node.hidden=!!(o&&((status&&o.status!==status)||(health&&o.health!==health)||(dueBy&&(!o.due_at||o.due_at>dueBy))||
   (term&&!`${o.id} ${o.order.product||''} ${o.buyer_name||''}`.toLowerCase().includes(term))));
 });
}

 orderView=view;
 const list=$('#orders-list');if(list)list.classList.toggle('board',view==='board');
 if($('#list-view'))$('#list-view').setAttribute('aria-pressed',String(view==='list'));
 if($('#board-view'))$('#board-view').setAttribute('aria-pressed',String(view==='board'));

function openOrder(id){location.hash=`#orders/${Number(id)}`;if(location.hash===`#orders/${Number(id)}`)renderTab(SakhiTabs.current());}

   <button class="secondary" onclick="leaderRevealBuyerContact(${Number(o.buyer?.id)},'order-contact-${Number(id)}')">Show contact · access is recorded</button><div id="order-contact-${Number(id)}"></div>
   <p>Specifications: ${esc(o.order.specifications||o.order.colour||'Not provided')}</p><p>Delivery address: ${esc(o.order.delivery_address||'Not provided')}</p>
   <h3>Past orders with this group</h3>${o.buyer?.past_orders?.length?o.buyer.past_orders.map(previous=>`<p>Order #${previous.id} · ${esc(previous.product)} × ${previous.qty} · ${esc(previous.status)}</p>`).join(''):'<p class="muted">No earlier orders.</p>'}
  </section><section class="card"><h3>Buyer payment record</h3><p>Status: ${esc(o.buyer_payment?.status||'not recorded')}</p>
   ${(o.buyer_payment?.payments||[]).map(payment=>`<p>${esc(payment.status)} · ${money(payment.amount)}${payment.note?` · ${esc(payment.note)}`:''}</p>`).join('')}
   <div class="row"><label for="pay-status-${Number(id)}">Status</label><select id="pay-status-${Number(id)}"><option value="unpaid">Unpaid</option><option value="advance">Advance</option><option value="paid">Paid</option></select>
   <label for="pay-amount-${Number(id)}">Amount</label><input id="pay-amount-${Number(id)}" type="number" min="0" step="0.01">
   <input id="pay-note-${Number(id)}" maxlength="250" placeholder="Note"><button onclick="recordBuyerPayment(${Number(id)})">Save payment record</button></div>
  </section><section class="card"><h3>Private leader notes</h3>${(o.notes||[]).map(note=>`<p class="notice-row">${esc(note.note)} <span class="muted">${since(note.created)}</span></p>`).join('')||'<p class="muted">No notes yet.</p>'}
   <textarea id="order-note-${Number(id)}" maxlength="500" placeholder="Only leaders can see this note"></textarea><button class="secondary" onclick="saveOrderNote(${Number(id)})">Add private note</button></section>`;

 const note=$(`#order-note-${id}`).value;
 try{await api(`/leader/orders/${id}/notes`,'POST',{note});toast('Private note saved');await showDrawer(id);}

async function recordBuyerPayment(id){
 const status=$(`#pay-status-${id}`).value,amount=$(`#pay-amount-${id}`).value,note=$(`#pay-note-${id}`).value;
 try{await api(`/leader/orders/${id}/buyer-payment`,'POST',{status,amount,note});toast('Buyer payment record saved');await showDrawer(id);buyersData=null;alertsData=null;}
 catch(error){toast(error.message,1);}
}
function closeDrawer(navigate=true){const el=$('#order-drawer');if(el)el.remove();if(navigate&&SakhiTabs.current().item)location.hash='#orders';}
async function refreshLive(batch){
 if(batch.some(x=>x.type==='resync'||x.type==='poll')){await load();return;}
 const ids=[...new Set(batch.filter(x=>x.order_id!=null).map(x=>Number(x.order_id)).filter(Number.isInteger))];
 if(ids.some(id=>!overviewData.orders.some(o=>o.id===id))){await load();return;}
 try{
  const [summary,...details]=await Promise.all([
   api('/leader/overview?summary=true'),
   ...ids.map(id=>api('/leader/orders/'+id))
  ]);
  overviewData={...overviewData,...summary,orders:[...overviewData.orders]};
  const scopes=new Set(batch.flatMap(x=>x.refresh||[]));
  const extra=[];
  if(scopes.has('team'))extra.push(api('/leader/team').then(data=>{teamData=data;}));
  if(scopes.has('notices')||scopes.has('team'))extra.push(Promise.all([api('/leader/notices'),api('/leader/leaves')]).then(data=>{noticesData=data[0];leavesData=data[1];}));
  if(scopes.has('buyers'))extra.push(api('/leader/buyers').then(data=>{buyersData=data;}));
  if(scopes.has('alerts'))extra.push(api('/leader/alerts').then(data=>{alertsData=data;}));
  if(scopes.has('pricing'))extra.push(api('/leader/ratecards').then(data=>{rateCardsData=data;}));
  await Promise.all(extra);
  details.forEach(detail=>{
   const index=overviewData.orders.findIndex(o=>o.id===detail.id);
   if(index<0)return;
   const rows=(detail.progress||{}).rows||[],stages={};
   rows.forEach(row=>{const stage=stages[row.stage]||(stages[row.stage]={name:row.stage,done:0,units:0});stage.done+=row.done;stage.units+=row.units;});
   detail.stages=Object.values(stages).map(stage=>({...stage,pct:stage.units?Math.floor(stage.done*100/stage.units):0}));
   overviewData.orders[index]={...overviewData.orders[index],...detail};
  });
  renderTab(SakhiTabs.current());
  if($('#order-drawer')&&/^\d+$/.test(SakhiTabs.current().item||''))await showDrawer(Number(SakhiTabs.current().item));
 }catch(e){toast(e.message,1);}
}
async function load(){
 try{
  const [data,team]=await Promise.all([api('/leader/overview'),api('/leader/team')]);
  overviewData=data;teamData=team;
  if(SakhiTabs.current().tab==='pricing')rateCardsData=await api('/leader/ratecards');
  ensureShell();renderTab(SakhiTabs.current());
  if(!liveClient&&window.SakhiLive){
   liveClient=SakhiLive.start({scope:['orders','team','activity'],since:data.last_seq,onEvent:batch=>{
    refreshLive(batch);
   },onState:info=>{
    const el=$('#live-status'),banner=$('#offline-banner');if(!el)return;
    el.textContent=`${info.state==='live'?'Live':info.state==='polling'?'Reconnecting':'Offline'} · updated ${info.secondsAgo}s ago`;
    el.className='live-status '+(info.state==='live'?'':'reconnecting');
    banner.hidden=info.state==='live';
    banner.textContent=info.state==='polling'?'Live updates are reconnecting. Checking again every 8 seconds.':'Connection lost. Showing the latest available information.';
   }});
  }
 }catch(e){toast(e.message,1);}
}
function payout(id){const r={};document.querySelectorAll(`.acc[data-o="${id}"]`).forEach(e=>{(r[e.dataset.k]=r[e.dataset.k]||{}).accepted=+e.value});document.querySelectorAll(`.pen[data-o="${id}"]`).forEach(e=>{(r[e.dataset.k]=r[e.dataset.k]||{}).pending=+e.value});act('/leader/orders/'+id+'/payout','POST',{results:r},load)}
function blockO(id){const r=prompt('Why is the delivery blocked?');if(r)act('/leader/orders/'+id+'/block','POST',{reason:r},load)}
function cancelO(id){if(confirm('Cancel this order? Only possible before work starts.'))act('/leader/orders/'+id+'/cancel','POST',{reason:prompt('Reason (optional)')||''},load)}
function dphoto(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return;const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);act('/leader/orders/'+id+'/delivery-photo','POST',{photo:c.toDataURL('image/jpeg',.7)},load)};img.onerror=()=>toast('That file is not a photo',1);img.src=URL.createObjectURL(file)};f.click()}
function saveCl(id){act('/leader/orders/'+id+'/checklist','PUT',{items:$('#cl'+id).value.split('\n')},load)}
function rework(id,n){const k=prompt('How many pieces need rework?');if(k)act('/leader/orders/'+id+'/quality','POST',{member:Number(n),decision:'rework',rework:+k,reason:prompt('Reason')||''},load)}
function risk(id){const d=prompt('Days left to the deadline?');if(d!==null)act('/leader/orders/'+id+'/risk','POST',{days_left:d},load)}
async function checkFit(id){try{fitResults[id]=await api('/leader/orders/'+Number(id)+'/review');await showDrawer(Number(id));}catch(error){toast(error.message,1)}}
function addM(){act('/leader/members','POST',{name:$('#n').value,phone:$('#p').value,skills:$('#s').value.split(',').map(x=>x.trim()).filter(Boolean),capacity:+$('#k').value},load)}

const _rcTxt=c=>`${esc(c.label)} v${c.version||0} ${c.source==='default'?'(template default)':'(group approved)'}: `+c.stages.map(s=>`${esc(s.name)} Rs ${s.rate} x${s.workers}`).join(', ')+` | material Rs ${c.cost.material}, ${c.cost.minutes} min, Rs ${c.cost.hourly}/hr, overhead ${c.cost.overhead_pct}%, margin ${c.cost.margin_pct}%`;

function rcPropose(){const st=$('#rcs').value.split(',').map(x=>x.trim().split(':')).filter(x=>x[0]).map(x=>({name:x[0],rate:+x[1],workers:+(x[2]||1)}));
 const c=$('#rcc').value.split(',').map(x=>+x.trim());act('/leader/ratecards','POST',{product:$('#rcp').value,stages:st,cost:{material:c[0],minutes:c[1],hourly:c[2],overhead_pct:c[3],margin_pct:c[4]},note:$('#rcn').value},load)}
boot('leader','Group leader dashboard').then(load);
</script></body></html>
