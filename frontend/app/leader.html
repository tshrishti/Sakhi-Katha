<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leader - Sakhi Khata</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main><div id="toast"></div>
<script src="common.js"></script><script>
const RES={possible_defect:'Possible defect',met:'Looks OK',cannot_tell:'Cannot tell from photo'};
const ai=(q,oid,i)=>{const s=q.screening;if(!s)return '';
 const head='<div class="ai"><b>AI pre-check</b> <span class="muted">(suggestion only. You decide.)</span>';
 if(s.status!=='ok')return head+`<p class="${s.status==='unavailable'?'warn':''}">${esc(s.summary)} ${q.status==='pending'&&s.status==='unavailable'?`<button onclick="act('/leader/orders/${oid}/quality/${i}/rescreen','POST',{},load)">Try again</button>`:''}</p></div>`;
 const f=s.items.filter(x=>x.result==='possible_defect'),u=s.items.filter(x=>x.result==='cannot_tell');
 return head+(s.summary?`<p class="muted">${esc(s.summary)}</p>`:'')+(f.length?`<p class="bad">${f.length} possible problem(s) to verify on the piece:</p><ul>${f.sort((a,b)=>'high medium low'.indexOf(a.confidence)-'high medium low'.indexOf(b.confidence)).map(x=>`<li><span class="conf ${esc(x.confidence)}">${esc(x.confidence)} confidence</span> <b>${esc(x.criterion)}</b><br><span class="muted">${esc(x.note)}</span></li>`).join('')}</ul>`:'<p>No problems spotted in the photo. The AI can miss things.</p>')
  +(u.length?`<p class="muted">${u.length} point(s) could not be judged from the photo: ${u.map(x=>esc(x.criterion)).join('; ')}</p>`:'')
  +`<details><summary class="muted">All ${s.items.length} checks</summary><table>${s.items.map(x=>`<tr><td>${esc(x.criterion)}</td><td>${RES[x.result]}</td><td>${esc(x.confidence)}</td></tr>`).join('')}</table></details></div>`};
const checklist=o=>`<details class="cl"><summary>Buyer's quality checklist (${(o.checklist||[]).length})</summary><p class="muted">The AI checks sample photos against this list. One point per line. Add anything the buyer told you, remove what does not apply.</p>
 <textarea id="cl${o.id}">${(o.checklist||[]).map(c=>esc(c.text)).join('\n')}</textarea><button onclick="saveCl(${o.id})">Save checklist</button></details>`;
const card=o=>{const p=o.price,pl=o.plan,po=o.payout;let a='';
 if(o.status==='submitted'||o.status==='quoted')a=`<div class="row"><input id="c${o.id}" placeholder="Counter Rs/pc (blank = floor-based)" size="26"><button onclick="act('/leader/orders/${o.id}/quote','POST',{counter:$('#c${o.id}').value},load)">${o.status==='quoted'?'Re-quote':'Send quote'}</button></div>`;
 if(o.status==='accepted')a=`<button onclick="act('/leader/orders/${o.id}/plan','POST',{},load)">Build fair plan</button>`;
 if(o.status==='planned')a=`<button onclick="act('/leader/orders/${o.id}/start','POST',{},load)">Approve and start</button> <button onclick="act('/leader/orders/${o.id}/plan','POST',{},load)">Replan</button>`;
 if(o.status==='in_production')a=`${(o.quality||[]).map((q,i)=>`<div class="qrow"><p>${esc(q.name)} sample (${esc(q.stage)}) ${chip(q.status)} ${q.has_photo?`<a href="/api/leader/orders/${o.id}/quality/${i}/photo" target="_blank">photo</a>`:''} ${q.status==='pending'?`<button onclick="act('/leader/orders/${o.id}/quality','POST',{member:'${esc(q.name)}',decision:'pass'},load)">Pass</button> <button class="red" onclick="rework(${o.id},'${esc(q.name)}')">Needs rework</button>`:''}</p>${ai(q,o.id,i)}</div>`).join('')}
 <p>Finished through every stage: ${o.progress.finished}/${o.progress.needed} <button onclick="risk(${o.id})">Check deadline</button> ${o.risk?`<span class="${o.risk.shortfall?'bad':''}">${o.risk.shortfall?'Short by '+o.risk.shortfall+' pieces. You and the group decide: '+o.risk.options.map(esc).join('; '):'On time'}</span>`:''}</p><table>${pl.assignments.map(x=>`<tr><td>${esc(x.name)} - ${esc(x.stage)}</td><td>accepted <input class="acc" data-o="${o.id}" data-k="${x.member}:${x.stage}" type="number" min="0" value="${x.units}" style="width:80px"></td><td>need rework <input class="pen" data-k="${x.member}:${x.stage}" data-o="${o.id}" type="number" min="0" value="0" style="width:70px"></td></tr>`).join('')}</table><button onclick="payout(${o.id})">Propose payout</button>`;
 if(o.status==='payout_pending')a=`<p>Total Rs ${esc(po.total)}. Leader ${o.approvals.leader?'approved':'pending'}, members approved: ${o.approvals.members.length}.</p>${o.approvals.leader?'':`<button onclick="act('/leader/orders/${o.id}/payout/approve','POST',{},load)">Approve payout</button>`}
 ${o.disputes.map((d,i)=>d.open?`<p class="bad">Dispute by ${esc(d.name)}: ${esc(d.reason)} <button onclick="act('/leader/orders/${o.id}/disputes/${i}/resolve','POST',{note:prompt('Resolution note')||''},load)">Resolve</button></p>`:'').join('')}`;
 const d=o.delivery,sh=d.shipments,last=sh[sh.length-1];
 if(['settled','partially_delivered'].includes(o.status))a=`<p>Delivered ${d.delivered}/${d.ordered}. Count the packed pieces (still owed: ${d.remaining}).</p><div class="row"><input id="rd${o.id}" type="number" min="1" max="${d.remaining}" value="${d.remaining}" style="width:90px"><input id="rn${o.id}" placeholder="Note"><button onclick="act('/leader/orders/${o.id}/ready','POST',{counted:+$('#rd${o.id}').value,note:$('#rn${o.id}').value},load)">Mark ready for delivery</button></div>`;
 if(o.status==='ready_for_delivery')a=`<p>${d.qc.counted} of ${d.qc.owed} owed pieces counted${d.qc.match?'':' <b class="warn">(partial delivery)</b>'}.</p><div class="row"><input id="dc${o.id}" placeholder="Courier / bus / vehicle"><input id="dt${o.id}" placeholder="Tracking / vehicle no."><input id="dd${o.id}" placeholder="Dispatch date"><button onclick="act('/leader/orders/${o.id}/dispatch','POST',{courier:$('#dc${o.id}').value,tracking:$('#dt${o.id}').value,date:$('#dd${o.id}').value},load)">Dispatch</button></div>`;
 if(o.status==='dispatched')a=`<p>Shipment ${last.i+1}: ${last.qty} pcs via ${esc(last.courier)}${last.tracking?' ('+esc(last.tracking)+')':''}. Waiting for the buyer to confirm. ${last.has_photo?`<a href="/api/leader/orders/${o.id}/delivery/${last.i}/photo" target="_blank">delivery photo</a>`:`<button onclick="dphoto(${o.id})">Add delivery photo</button>`}</p>`;
 if(o.status==='blocked')a=`<p class="warn">Blocked: ${esc((d.blocked||{}).reason)} <button onclick="act('/leader/orders/${o.id}/unblock','POST',{},load)">Unblock</button></p>`;
 if(o.status==='closed')a=`<p>Delivered ${d.delivered}/${d.ordered}. Closed.</p>`;
 if(o.status==='cancelled')a=`<p class="muted">Cancelled${d.cancelled?' by '+esc(d.cancelled.by)+(d.cancelled.reason?': '+esc(d.cancelled.reason):''):''}.</p>`;
 if(['settled','ready_for_delivery','dispatched','partially_delivered'].includes(o.status))a+=` <button class="red" onclick="blockO(${o.id})">Block</button>`;
 if(['submitted','quoted','accepted','planned'].includes(o.status))a+=` <button class="red" onclick="cancelO(${o.id})">Cancel order</button>`;
 return `<div class="card"><div class="row"><b>#${o.id}</b> ${chip(o.status)} <span>${o.order.qty} pcs @ Rs ${o.order.offered_price}, ${o.order.deadline_days} days, ${esc(o.order.colour||'')}</span></div>
 ${o.unclear.length?`<p class="warn">Check with buyer: ${o.unclear.map(esc).join('; ')}</p>`:''}
 ${p?`<p class="${p.loss_making?'bad':''}">Floor Rs ${esc(p.per_unit.floor)}/pc. At the offer, women earn Rs ${esc(p.effective_hourly_at_offer)}/hr vs target Rs ${esc(p.target_hourly)}/hr (${esc(p.pay_gap_pct)}% less). Quote: Rs ${esc(o.quote)}</p>`:''}
 ${pl&&o.status==='planned'?`<table>${pl.assignments.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.stage)} x${x.units}</td><td>Rs ${esc(x.expected_pay)}</td><td>${(o.task_accepted||[]).includes(x.member)?'<span class="ok">accepted</span>':'<span class="muted">not yet accepted</span>'}</td><td class="muted">${esc(x.why)}</td></tr>`).join('')}</table>${pl.issues.length?`<p class="warn">Risk: ${pl.issues.map(esc).join('; ')}</p>`:''}${(pl.options||[]).length?`<div class="warn"><b>Not feasible as ordered. Options:</b><ul>${pl.options.map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul><span class="muted">Agree one with the buyer, then re-quote or replan.</span></div>`:''}`:''}${a}${['accepted','planned','in_production'].includes(o.status)?checklist(o):''}</div>`};
async function load(){const [os,ms]=await Promise.all([api('/leader/orders'),api('/leader/members')]);
 $('#m').innerHTML=(os.map(card).join('')||'<div class="card muted">No orders yet.</div>')+`<div class="card"><h2>Group members</h2><table>${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${(m.skills||[]).map(esc).join(', ')}</td><td>${m.capacity}/day</td></tr>`).join('')}</table>
 <div class="row"><input id="n" placeholder="Name"><input id="p" placeholder="Phone"><input id="s" placeholder="skills: cutting, stitching"><input id="k" type="number" placeholder="pieces/day" style="width:110px"><button onclick="addM()">Add member</button></div>
 <button onclick="api('/ledger/verify').then(v=>toast(v.valid?'Ledger intact ('+v.events+' events)':'TAMPERING at event '+v.broken_at,!v.valid))">Verify audit ledger</button></div>`}
function payout(id){const r={};document.querySelectorAll(`.acc[data-o="${id}"]`).forEach(e=>{(r[e.dataset.k]=r[e.dataset.k]||{}).accepted=+e.value});document.querySelectorAll(`.pen[data-o="${id}"]`).forEach(e=>{(r[e.dataset.k]=r[e.dataset.k]||{}).pending=+e.value});act('/leader/orders/'+id+'/payout','POST',{results:r},load)}
function blockO(id){const r=prompt('Why is the delivery blocked?');if(r)act('/leader/orders/'+id+'/block','POST',{reason:r},load)}
function cancelO(id){if(confirm('Cancel this order? Only possible before work starts.'))act('/leader/orders/'+id+'/cancel','POST',{reason:prompt('Reason (optional)')||''},load)}
function dphoto(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return;const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);act('/leader/orders/'+id+'/delivery-photo','POST',{photo:c.toDataURL('image/jpeg',.7)},load)};img.onerror=()=>toast('That file is not a photo',1);img.src=URL.createObjectURL(file)};f.click()}
function saveCl(id){act('/leader/orders/'+id+'/checklist','PUT',{items:$('#cl'+id).value.split('\n')},load)}
function rework(id,n){const k=prompt('How many pieces need rework?');if(k)act('/leader/orders/'+id+'/quality','POST',{member:n,decision:'rework',rework:+k,reason:prompt('Reason')||''},load)}
function risk(id){const d=prompt('Days left to the deadline?');if(d!==null)act('/leader/orders/'+id+'/risk','POST',{days_left:d},load)}
function addM(){act('/leader/members','POST',{name:$('#n').value,phone:$('#p').value,skills:$('#s').value.split(',').map(x=>x.trim()).filter(Boolean),capacity:+$('#k').value},load)}

const _rcTxt=c=>`${esc(c.label)} v${c.version||0} ${c.source==='default'?'(template default)':'(group approved)'}: `+c.stages.map(s=>`${esc(s.name)} Rs ${s.rate} x${s.workers}`).join(', ')+` | material Rs ${c.cost.material}, ${c.cost.minutes} min, Rs ${c.cost.hourly}/hr, overhead ${c.cost.overhead_pct}%, margin ${c.cost.margin_pct}%`;

const _load=load;load=async function(){await _load();const d=await api('/leader/ratecards');const pend=d.history.filter(h=>h.status==='proposed');
 $('#m').insertAdjacentHTML('beforeend',`<div class="card"><h2>Rate cards (approved by the group)</h2>${d.active.map(c=>`<p>${_rcTxt(c)}</p>`).join('')}
 ${pend.map(h=>`<p class="warn">Waiting: ${_rcTxt({...h,source:'group'})} - members approved ${h.approvals.members.length}/${h.needed_members} <button class="red" onclick="act('/leader/ratecards/${h.id}/reject','POST',{},load)">Withdraw</button></p>`).join('')}
 <h3>Propose a new version</h3><div class="row"><select id="rcp">${d.active.map(c=>`<option value="${esc(c.product)}">${esc(c.label)}</option>`).join('')}</select>
 <input id="rcs" size="46" placeholder="stages as name:rate:workers, e.g. cutting:5:1, stitching:16:2"><input id="rcc" size="40" placeholder="material, minutes, hourly, overhead %, margin %  e.g. 38,40,50,8,10"><input id="rcn" placeholder="Note"><button onclick="rcPropose()">Propose</button></div>
 <p class="muted">Members approve it in their dashboard. Orders already quoted keep the card they were priced on.</p></div>`)};
function rcPropose(){const st=$('#rcs').value.split(',').map(x=>x.trim().split(':')).filter(x=>x[0]).map(x=>({name:x[0],rate:+x[1],workers:+(x[2]||1)}));
 const c=$('#rcc').value.split(',').map(x=>+x.trim());act('/leader/ratecards','POST',{product:$('#rcp').value,stages:st,cost:{material:c[0],minutes:c[1],hourly:c[2],overhead_pct:c[3],margin_pct:c[4]},note:$('#rcn').value},load)}
boot('leader','Group leader dashboard').then(load);
</script></body></html>
